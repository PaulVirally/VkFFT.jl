name: CompatHelper

on:
  schedule:
    # Weekly, Monday 05:00 UTC.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Install CompatHelper
        # Not a dependency of the package, so it goes into the run's default
        # environment.
        run: |
          import Pkg
          name = "CompatHelper"
          uuid = "aa819f21-2bde-4658-8897-bab36330d9b7"
          version = "3"
          Pkg.add(; name, uuid, version)
        shell: julia --color=yes {0}
      - name: Run CompatHelper
        # "" is the package itself, "test" the OpenCL test environment and
        # "test/cuda" the CUDA one, which no hosted runner ever resolves.
        run: |
          import CompatHelper
          CompatHelper.main(; subdirs=["", "test", "test/cuda"])
        shell: julia --color=yes {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pull requests opened with GITHUB_TOKEN do not trigger workflows, so
          # CompatHelper's pull requests arrive without CI results. Setting an
          # ssh deploy key or a personal access token below fixes that.
          # COMPATHELPER_PRIV: ${{ secrets.COMPATHELPER_PRIV }}
