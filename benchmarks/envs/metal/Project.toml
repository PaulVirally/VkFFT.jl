# The Metal measurement environment. Metal.jl is macOS only and CUDA.jl is not,
# so a GPU package cannot live in benchmarks/Project.toml without deciding which
# machines can run the suite. Each backend gets a standalone environment holding
# the measurement deps plus its own, and the plotting deps stay out because no
# measurement run reads them.

[deps]
AbstractFFTs = "621f4979-c628-5d54-868e-fcf4e3e8185c"
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
FFTW = "7a1cc6ca-52ef-59f5-83cd-3a7055c09341"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Metal = "dde4c033-4e86-420c-a63e-0dd931031962"
Pkg = "44cfe95a-1eb2-52ea-b672-e2afdf69b78f"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
StableRNGs = "860ef19b-820b-49d6-a774-d7a799459cd3"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
TOML = "fa267f1f-6049-4f14-aa54-33bafae1ed76"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"
