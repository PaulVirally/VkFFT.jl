authors = ["Paul Virally"]
version = "0.1.0-dev"

[deps]
AbstractFFTs = "621f4979-c628-5d54-868e-fcf4e3e8185c"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
PrecompileTools = "aea7be01-6a6a-4083-8856-8a6e6704d82a"
Preferences = "21216c6a-2e73-6563-6e65-726566657250"
SHA = "ea8e919c-243c-51af-8825-aaa63cd721ce"
Scratch = "6c6a2e73-6563-6170-7368-637461726353"

[weakdeps]
CUDA = "052768ef-5323-5732-b1bb-66c8b64840ba"
Metal = "dde4c033-4e86-420c-a63e-0dd931031962"
OpenCL = "08131aa3-fb12-5dee-8b74-c09406e224a2"

[extensions]
# TODO: once VkFFT_CUDA_jll, VkFFT_OpenCL_jll and VkFFT_Metal_jll are registered
# these gain the matching JLL as a second trigger and the libvkfft_path
# preference turns into a fallback override. JLL UUIDs are fixed at registration
# time, so wiring a guessed one here would only be churn.
VkFFTCUDAExt = ["CUDA"]
VkFFTMetalExt = ["Metal"]
VkFFTOpenCLExt = ["OpenCL"]

[compat]
AbstractFFTs = "1.5"
CUDA = "5, 6"
LinearAlgebra = "1"
Metal = "1.10"
OpenCL = "0.10"
PrecompileTools = "1.2"
Preferences = "1.4"
SHA = "0.7"
Scratch = "1.2"
julia = "1.10"
